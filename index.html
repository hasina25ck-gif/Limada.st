function small(f){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const s=256,c=document.createElement("canvas");c.width=c.height=s;
  const m=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);c.toBlob(ok,"image/jpeg",.85)};i.onerror=ko;i.src=URL.createObjectURL(f)})}
