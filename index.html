<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#110c10;--ink:#f3ebdd;--mute:#a89a88;--line:#3a2e22;--acc:#b3202f;--in:#1d161a;--gold:#c9a45c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}h1,h2{font-family:"Playfair Display",Georgia,serif;margin:8px 0;color:var(--gold);font-weight:600}.logo{display:block;margin:6px auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}
button{border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;color:#fff;background:var(--acc);cursor:pointer;margin:8px 6px 0 0}
button.alt{background:none;color:var(--gold);border:1px solid var(--gold)}
.m{color:var(--mute);font-size:14px}.e{color:#c0392b;min-height:22px}
.bar{display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1 1 auto;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border-radius:12px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--in);word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--acc);color:#fff}.b small{display:block;opacity:.7}
.row{display:flex;gap:8px}.row input{flex:1}
img.s{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.nav button{margin:0;padding:8px 12px}
.av{border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none;font-weight:700;position:relative}.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mr{display:flex;gap:6px;align-items:flex-end}.mr.mine{justify-content:flex-end}
.row2{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9}
.q{font-size:13px;opacity:.85;border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:4px;cursor:pointer}.b.me .q{border-color:#fff}
.rb{align-items:center;gap:8px;background:var(--in);border-radius:12px;padding:6px 10px;margin-top:6px;font-size:14px}
.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ban{height:110px;border-radius:12px;background:linear-gradient(120deg,var(--acc),#2a1620);margin:0 -4px}
.avw{position:relative;width:112px;margin:-56px auto 0}.avw .av{border:4px solid var(--card)}
.cam{position:absolute;right:-6px;bottom:-2px;width:38px;height:38px;border-radius:50%;padding:0;margin:0;border:3px solid var(--card)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pr{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pr span:first-child{color:var(--mute)}.pr>span:last-child,.pr>input{text-align:right;max-width:60%;word-break:break-all}
.bdg{display:inline-block;background:var(--acc);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:6px;font-family:system-ui,sans-serif;vertical-align:middle}
.dot{position:absolute;right:1px;bottom:1px;width:26%;height:26%;min-width:10px;min-height:10px;border-radius:50%;background:#2ecc71;border:2px solid #000}
.mv{min-height:100dvh;display:flex;flex-direction:column}.mv>*{flex:none}.mv>.main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding-bottom:78px}.main>*{flex:none}.main>.msgs{flex:1 1 auto}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;display:flex;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tb{flex:1;background:none;color:var(--mute);border:0;border-radius:0;margin:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;font-weight:400}.tb span{font-size:20px;line-height:1.2}.tb small{font-size:11px}.tb.on{color:var(--gold)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:8px 0;margin-bottom:4px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;flex:none;cursor:pointer;font-size:12px}.sc span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;border:2px solid var(--line);position:relative}.ring.on{border:0;padding:5px;background:linear-gradient(135deg,var(--gold),var(--acc))}.ring .av{border:2px solid #000}

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  me=p;
  if(!p)return show(h("div",{className:"c"},h("h2",{},"Compte introuvable"),out()));
  if(p.status==="pending")return show(h("div",{className:"c"},h("h2",{},"Demande envoyée"),h("p",{},"Le gérant vérifie votre dossier. Revenez plus tard."),out()));
  if(p.status==="banned")return show(h("div",{className:"c"},h("h2",{},"Accès refusé"),out()));
  mainView();
}
